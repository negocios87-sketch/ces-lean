<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CES & LEAN · Board Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f2ede6;--surface:#fff;--navy:#1c2b3a;
  --gold:#b8873f;--goldP:#f5e9d6;--sage:#4a7c6a;--rust:#c0533a;
  --muted:#8a8277;--border:#e0d9d0;--text:#1c2020;
  --radius:8px;--shadow:0 1px 3px rgba(28,32,32,.06),0 4px 16px rgba(28,32,32,.06);
  --lean:#4a6fa5;--lean2:#7096c4;--leanBg:#f0f4fb;
  --ces:#0e7490;--ces2:#06b6d4;--cesBg:#ecfeff;
}
html{font-size:14px}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}

.topbar{background:var(--navy);padding:0 28px;display:flex;align-items:stretch;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.tb-left{display:flex;align-items:center;gap:20px}
.tb-logo{font-family:'Fraunces',serif;font-size:1.05rem;font-weight:700;color:var(--gold);letter-spacing:.05em}
.tb-title{font-family:'Fraunces',serif;font-size:1rem;font-weight:300;color:rgba(255,255,255,.5);letter-spacing:.02em}
.tb-sep{width:1px;height:30px;background:rgba(255,255,255,.12)}
.prod-toggle{display:flex;gap:3px;padding:10px 0}
.ptog{background:none;border:none;color:rgba(255,255,255,.45);font-family:'DM Sans',sans-serif;font-size:.78rem;font-weight:700;padding:6px 20px;cursor:pointer;border-radius:6px;letter-spacing:.06em;text-transform:uppercase;transition:all .15s}
.ptog:hover{color:rgba(255,255,255,.85)}
.ptog.lean{background:var(--lean);color:#fff}
.ptog.ces{background:var(--ces);color:#fff}
.tb-right{display:flex;align-items:center;gap:12px}
.tb-meta{font-size:.68rem;color:rgba(255,255,255,.32);letter-spacing:.03em}
.tbtn{background:none;border:1px solid rgba(255,255,255,.18);border-radius:6px;color:rgba(255,255,255,.7);font-family:'DM Sans',sans-serif;font-size:.75rem;font-weight:500;padding:6px 14px;cursor:pointer;transition:all .15s}
.tbtn:hover{background:rgba(255,255,255,.1);color:#fff}
.tbtn:disabled{opacity:.4;cursor:default}

.page{max-width:1200px;margin:0 auto;padding:28px 24px 64px}

.ph-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:28px;padding-bottom:20px;border-bottom:2px solid var(--border)}
.ph-eye{font-size:.64rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.ph-ttl{font-family:'Fraunces',serif;font-size:2rem;font-weight:700;color:var(--navy);line-height:1.1}
.ph-sub{font-size:.8rem;color:var(--muted);margin-top:6px}
.ph-badge{display:inline-block;padding:4px 14px;border-radius:20px;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.badge-lean{background:var(--leanBg);color:var(--lean)}
.badge-ces{background:var(--cesBg);color:var(--ces)}

.sec-block{margin-top:36px;margin-bottom:16px}
.sec-eyebrow{font-size:.62rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.sec-title{font-family:'Fraunces',serif;font-size:1.3rem;font-weight:700;color:var(--navy);line-height:1.1}
.sec-date-tag{display:inline-block;padding:3px 12px;border-radius:20px;font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-left:10px;vertical-align:middle;position:relative;top:-2px}
.tag-ganho{background:#dcfce7;color:#166534}
.tag-perda{background:#fee2e2;color:#991b1b}
.tag-criado{background:var(--leanBg);color:var(--lean)}
.sec-divider{height:2px;border-radius:2px;margin-top:10px}
.div-lean{background:linear-gradient(90deg,var(--lean),var(--lean2))}
.div-ces{background:linear-gradient(90deg,var(--ces),var(--ces2))}
.div-ganho{background:linear-gradient(90deg,#166534,#4ade80)}
.div-perda{background:linear-gradient(90deg,#991b1b,#f87171)}

.kpi-row{display:grid;gap:10px;margin-bottom:18px}
.kpi5{grid-template-columns:repeat(5,1fr)}
.kpi3{grid-template-columns:repeat(3,1fr)}
.kpi2{grid-template-columns:repeat(2,1fr)}
.kpi1{grid-template-columns:1fr}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 16px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi-accent{position:absolute;top:0;left:0;right:0;height:3px}
.kpi .lbl{font-size:.62rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.kpi .val{font-family:'Fraunces',serif;font-size:1.75rem;font-weight:700;color:var(--navy);line-height:1}
.kpi .sub{font-size:.69rem;color:var(--muted);margin-top:5px}

.charts-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.charts-1{margin-bottom:16px}
.ccard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 18px 14px;box-shadow:var(--shadow)}
.ccard-ttl{font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.cwrap{position:relative;height:170px}
.cwrap.md{height:200px}

/* Linha de dois painéis lado a lado (tabela + ot-card) */
.side-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;align-items:start}

.gtog-row{display:flex;gap:6px;margin-bottom:16px}
.gtog{background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:7px 18px;cursor:pointer;transition:all .15s}
.gtog:hover{border-color:var(--navy);color:var(--navy)}
.gtog.active{background:var(--navy);border-color:var(--navy);color:#fff}

.twrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:auto}
table{width:100%;border-collapse:collapse;font-size:.8rem}
thead{background:var(--navy)}
thead th{color:rgba(255,255,255,.75);font-size:.62rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;padding:10px 14px;text-align:left;white-space:nowrap}
thead th:not(:first-child){text-align:right}
tbody tr{border-bottom:1px solid var(--border);transition:background .12s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--bg)}
tbody td{padding:9px 14px;white-space:nowrap}
tbody td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
tfoot td{padding:9px 14px;font-weight:700;color:var(--navy);background:var(--goldP);border-top:1.5px solid var(--border)}
tfoot td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
.td-name{font-weight:500;color:var(--navy)}
.ori-row:hover{background:var(--goldP)!important}
tr.outros-hidden{display:none!important}

.ot-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.ot-title{font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.ot-rows{display:flex;flex-direction:column;gap:10px}
.ot-row{display:flex;align-items:center;gap:10px}
.ot-label{width:130px;flex-shrink:0;font-size:.78rem;color:var(--text)}
.ot-track{flex:1;background:var(--border);border-radius:3px;height:7px}
.ot-fill{height:7px;border-radius:3px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.ot-val{width:28px;text-align:right;font-size:.78rem;font-weight:700;color:var(--navy)}
.ot-pct{width:34px;text-align:right;font-size:.7rem;color:var(--muted)}

.motivos{display:flex;flex-direction:column;gap:9px}
.motivo-row{display:flex;align-items:center;gap:10px}
.motivo-name{width:150px;flex-shrink:0;font-size:.77rem;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.motivo-track{flex:1;background:var(--border);border-radius:3px;height:5px}
.motivo-fill{height:5px;border-radius:3px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.motivo-pct{width:34px;text-align:right;font-size:.69rem;color:var(--muted)}
.motivo-count{width:26px;text-align:right;font-size:.77rem;font-weight:600;color:var(--navy)}

.sec-lbl2{font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.sec-lbl2 span{flex:1;height:1px;background:var(--border);display:block}

.state-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:360px;gap:14px;color:var(--muted)}
.spinner{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.errbanner{background:#fef2f2;border:1px solid #fecaca;border-radius:var(--radius);color:#991b1b;padding:12px 16px;font-size:.82rem;margin-bottom:20px;display:none}
.pfooter{margin-top:32px;padding-top:12px;border-top:1px solid var(--border);display:flex;justify-content:space-between}
.pfooter span{font-size:.67rem;color:var(--muted)}

/* ── ABA ANALÍTICA ── */
#pageAnalitica{display:none}
.an-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.an-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.an-card-title{font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.an-row{display:flex;align-items:center;gap:8px}
.an-lbl{width:0;flex:1;min-width:0;font-size:.78rem;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.an-track{width:60px;flex-shrink:0;background:var(--border);border-radius:3px;height:5px}
.an-fill{height:5px;border-radius:3px;transition:width .5s}
.an-val{width:28px;text-align:right;font-size:.78rem;font-weight:700;color:var(--navy)}
.an-pct{width:32px;text-align:right;font-size:.7rem;color:var(--muted)}
.motivo-tog{display:flex;gap:6px;margin-bottom:18px}
.funis-wrap{display:grid;grid-template-columns:1fr 320px;gap:16px;margin-bottom:24px;align-items:start}
.funis-table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:auto}
.funis-chart-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.funis-chart-ttl{font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.funis-chart-canvas{position:relative;height:240px}
@media(max-width:900px){.funis-wrap{grid-template-columns:1fr}}
.an-grid{align-items:stretch;overflow:hidden}
.an-card{min-width:0;overflow:hidden}
.an-card{display:flex;flex-direction:column}
.an-rows{flex:1}
.an-item-wrap{border-bottom:1px solid var(--border)}
.an-item-wrap:last-child{border-bottom:none}
.an-row{cursor:pointer;padding:5px 0;border-radius:4px;transition:background .1s}
.an-row:hover{background:var(--bg)}
.an-row-toggle{width:14px;flex-shrink:0;font-size:.65rem;color:var(--muted);text-align:center}
.an-detail{display:none;background:var(--bg);border-radius:6px;margin:4px 0 6px}
.an-detail.open{display:block}
.an-detail-table{width:100%;border-collapse:collapse}
.an-detail-table td{padding:4px 10px;font-size:.72rem;border-bottom:1px solid var(--border)}
.an-detail-table td:last-child{text-align:right;font-weight:600;color:var(--navy);width:32px}
.an-detail-table td:first-child{color:var(--muted)}
.an-detail-table tr:last-child td{border-bottom:none}
.mtog{background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:7px 18px;cursor:pointer;transition:all .15s}
.mtog:hover{border-color:var(--navy);color:var(--navy)}
.mtog.active{background:var(--navy);border-color:var(--navy);color:#fff}
@media(max-width:900px){.an-grid{grid-template-columns:1fr 1fr}}

@media(max-width:900px){
  .kpi5,.kpi3{grid-template-columns:1fr 1fr}
  .charts-2,.side-row{grid-template-columns:1fr}
}

/* ── SNAPSHOT / COMPARAÇÃO / HISTÓRICO ── */
.tbtn-snap{background:rgba(245,197,24,.15);border:1px solid rgba(245,197,24,.4);border-radius:6px;color:#f5c518;font-family:'DM Sans',sans-serif;font-size:.75rem;font-weight:600;padding:6px 14px;cursor:pointer;transition:all .15s}
.tbtn-snap:hover{background:rgba(245,197,24,.28)}
.tbtn-cmp{background:rgba(74,222,128,.12);border:1px solid rgba(74,222,128,.35);border-radius:6px;color:#4ade80;font-family:'DM Sans',sans-serif;font-size:.75rem;font-weight:600;padding:6px 14px;cursor:pointer;transition:all .15s}
.tbtn-cmp:hover{background:rgba(74,222,128,.22)}
.tbtn-cmp:disabled{opacity:.35;cursor:default}
.tbtn-clrcmp{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.35);border-radius:6px;color:#f87171;font-family:'DM Sans',sans-serif;font-size:.75rem;font-weight:600;padding:6px 14px;cursor:pointer;transition:all .15s;display:none}
.tbtn-clrcmp:hover{background:rgba(248,113,113,.22)}
.tbtn-pdf{background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.35);border-radius:6px;color:#38bdf8;font-family:'DM Sans',sans-serif;font-size:.75rem;font-weight:600;padding:6px 14px;cursor:pointer;transition:all .15s}
.tbtn-pdf:hover{background:rgba(56,189,248,.22)}
.tbtn-pdf:disabled{opacity:.35;cursor:default}

/* Modal de comparação */
.cmp-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9800;display:none;align-items:center;justify-content:center}
.cmp-overlay.open{display:flex}
.cmp-modal{background:var(--surface);border-radius:14px;padding:32px 28px;width:420px;max-width:92vw;box-shadow:0 24px 80px rgba(0,0,0,.4)}
.cmp-modal h3{font-family:'Fraunces',serif;font-size:1.1rem;font-weight:700;color:var(--navy);margin-bottom:6px}
.cmp-modal p{font-size:.78rem;color:var(--muted);margin-bottom:20px}
.cmp-drop-area{border:2px dashed var(--border);border-radius:10px;padding:28px;text-align:center;cursor:pointer;transition:border-color .15s;margin-bottom:16px}
.cmp-drop-area:hover{border-color:var(--lean)}
.cmp-drop-area p{color:var(--muted);font-size:.82rem;margin:0}
.cmp-drop-area input{display:none}
.cmp-modal-btns{display:flex;gap:8px;justify-content:flex-end}
.cmp-btn{background:var(--navy);color:#fff;border:none;border-radius:7px;padding:9px 20px;font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:600;cursor:pointer}
.cmp-btn-cancel{background:transparent;border:1px solid var(--border);color:var(--muted)}

/* Indicador de comparação ativa */
.cmp-banner{background:linear-gradient(90deg,#166534,#15803d);color:#fff;padding:8px 24px;font-size:.75rem;font-weight:600;letter-spacing:.04em;display:none;align-items:center;justify-content:space-between}
.cmp-banner.on{display:flex}
.cmp-banner button{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:5px;padding:3px 10px;font-size:.72rem;cursor:pointer}

/* Delta badges nos KPIs */
.kpi-delta{font-size:.68rem;font-weight:700;margin-top:4px;display:flex;align-items:center;gap:4px}
.delta-up{color:#4ade80}
.delta-dn{color:#f87171}
.delta-eq{color:var(--muted)}

/* Delta nos motivos */
.motivo-delta{width:42px;text-align:right;font-size:.68rem;font-weight:700}

/* Histórico overlay */
.hist-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9700;display:none;align-items:flex-start;justify-content:center;padding-top:48px}
.hist-overlay.open{display:flex}
.hist-modal{background:var(--bg);border-radius:14px;width:720px;max-width:95vw;max-height:80vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 80px rgba(0,0,0,.45)}
.hist-header{background:var(--navy);padding:18px 24px;display:flex;align-items:center;justify-content:space-between}
.hist-header h3{font-family:'Fraunces',serif;font-size:1rem;font-weight:700;color:#fff}
.hist-header button{background:none;border:none;color:rgba(255,255,255,.6);font-size:1.2rem;cursor:pointer;padding:4px 8px}
.hist-list{overflow-y:auto;flex:1;padding:16px}
.hist-empty{padding:40px;text-align:center;color:var(--muted);font-size:.85rem}
.hist-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.hist-item-left h4{font-family:'Fraunces',serif;font-size:.95rem;font-weight:600;color:var(--navy)}
.hist-item-left p{font-size:.72rem;color:var(--muted);margin-top:2px}
.hist-item-btns{display:flex;gap:8px}
.hist-btn{background:var(--navy);color:#fff;border:none;border-radius:6px;padding:6px 14px;font-family:'DM Sans',sans-serif;font-size:.72rem;font-weight:600;cursor:pointer}
.hist-btn-del{background:transparent;border:1px solid var(--border);color:var(--rust)}
.hist-btn-pdf{background:var(--gold);color:#fff}

@media print{
  @page{size:A4 portrait;margin:10mm}
  body{background:#fff!important}
  .topbar,.cmp-banner,#pToolbar,.state-wrap{display:none!important}
  .page{max-width:100%!important;padding:0!important}
  .print-page-break{page-break-before:always}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-left">
    <span class="tb-logo">Board Academy</span>
    <div class="tb-sep"></div>
    <span class="tb-title">Inteligência Comercial</span>
    <div class="tb-sep"></div>
    <div class="prod-toggle">
      <button class="ptog lean" id="togLean" onclick="setProduct('lean')">LEAN</button>
      <button class="ptog"      id="togCes"  onclick="setProduct('ces')">CES</button>
    </div>
    <div class="tb-sep"></div>
    <div style="display:flex;gap:3px;padding:10px 0">
      <button class="ptog" id="tabMain"     onclick="setTab('main')"     style="background:rgba(255,255,255,.15);color:#fff">Dashboard</button>
      <button class="ptog" id="tabAnalitica" onclick="setTab('analitica')" style="">Analítica</button>
    </div>
  </div>
  <div class="tb-right">
    <select id="selMes" onchange="onMesChange()" style="background:#2d4459;border:1px solid rgba(255,255,255,.18);border-radius:6px;color:#fff;font-family:'DM Sans',sans-serif;font-size:.75rem;padding:6px 10px;cursor:pointer;outline:none"></select>
    <span class="tb-meta" id="tbMeta">—</span>
    <button class="tbtn" onclick="openHistorico()">📋 Histórico</button>
    <button class="tbtn-pdf" id="btnPdf" onclick="gerarPDF()" disabled>🖨 PDF</button>
    <button class="tbtn-snap" onclick="doSnapshot()">📸 Snapshot</button>
    <button class="tbtn-cmp" id="btnComparar" onclick="openComparar()" disabled>⇄ Comparar</button>
    <button class="tbtn-clrcmp" id="btnLimparCmp" onclick="limparComparacao()">✕ Comparação</button>
    <button class="tbtn" id="btnRefresh" onclick="doRefresh()">↺ Atualizar</button>
  </div>
</div>

<!-- Banner comparação ativa -->
<div class="cmp-banner" id="cmpBanner">
  <span id="cmpBannerTxt">Comparando com: —</span>
  <button onclick="limparComparacao()">✕ Limpar</button>
</div>

<!-- Modal comparar -->
<div class="cmp-overlay" id="cmpOverlay">
  <div class="cmp-modal">
    <h3>Carregar Snapshot para Comparar</h3>
    <p>Selecione um arquivo <strong>.json</strong> salvo anteriormente</p>
    <div class="cmp-drop-area" onclick="document.getElementById('cmpFileInput').click()">
      <p>📂 Clique para selecionar o arquivo JSON</p>
      <input type="file" id="cmpFileInput" accept=".json" onchange="onCmpFile(event)">
    </div>
    <div class="cmp-modal-btns">
      <button class="cmp-btn cmp-btn-cancel" onclick="closeCmpModal()">Cancelar</button>
    </div>
  </div>
</div>

<!-- Modal histórico -->
<div class="hist-overlay" id="histOverlay">
  <div class="hist-modal">
    <div class="hist-header">
      <h3>📋 Histórico de Snapshots</h3>
      <button onclick="closeHistorico()">✕</button>
    </div>

</div>

  <div class="page">
    <div class="errbanner" id="errBannerAn"></div>
    <div id="contentAnalitica">
      <div class="state-wrap"><div class="spinner"></div><span>Carregando…</span></div>
    </div>
  </div>
</div>

<div id="pageMain">
<div class="page">
  <div class="errbanner" id="errBanner"></div>
  <div id="content">
    <div class="state-wrap"><div class="spinner"></div><span>Carregando dados…</span></div>
  </div>
</div>

<script>
let DATA=null, PROD='lean', MES_FILTRO=null;

/* ── Preenche seletor de meses ── */
function buildMesSelector(){
  const sel=document.getElementById('selMes');
  const now=new Date();
  const start=new Date(2026,0,1); // Jan/2026
  const meses=[];
  const d=new Date(start);
  while(d<=now){
    const ym=d.toISOString().substring(0,7);
    meses.push(ym);
    d.setMonth(d.getMonth()+1);
  }
  sel.innerHTML=meses.reverse().map(ym=>{
    const[y,m]=ym.split('-');
    const nome=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][+m-1]+'/'+y;
    return`<option value="${ym}">${nome}</option>`;
  }).join('');
  // Seleciona mês atual por padrão
  sel.value=now.toISOString().substring(0,7);
  MES_FILTRO=sel.value;
}

function onMesChange(){
  MES_FILTRO=document.getElementById('selMes').value;
  loadData();
}
const charts={};

const brl  = n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const brlK = n=>n>=1000?'R$'+(n/1000).toFixed(0)+'k':'R$'+Math.round(n);
const fmtN = n=>Math.round(n).toLocaleString('pt-BR');
const fmtW = w=>{const[,m,d]=w.split('-');return`${d}/${m}`;};
const fmtD = d=>{const[,,day]=d.split('-');return String(+day);};
const fmtM = ym=>{if(!ym)return'—';const[y,mo]=ym.split('-');return['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][+mo-1]+'/'+y;};
const esc  = s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

const C={lean:'#4a6fa5',lean2:'#7096c4',ces:'#0e7490',ces2:'#06b6d4'};
const color  = p=>p==='lean'?C.lean:C.ces;
const color2 = p=>p==='lean'?C.lean2:C.ces2;

Chart.register(ChartDataLabels);
Chart.defaults.font={family:'DM Sans',size:10};
Chart.defaults.color='#8a8277';
const GC='rgba(28,32,32,.06)';

function dk(id){if(charts[id]){charts[id].destroy();delete charts[id];}}

/* ── Delta plugin ── */
const deltaPlugin={
  id:'delta',
  afterDatasetsDraw(chart){
    if(!chart.options.plugins?.delta?.show)return;
    const{ctx}=chart;
    const meta=chart.getDatasetMeta(0);
    const data=chart.data.datasets[0].data;
    for(let i=1;i<meta.data.length;i++){
      const prev=data[i-1],curr=data[i];
      if(!prev||!curr)continue;
      const pct=(curr-prev)/prev*100;
      const isPos=pct>=0;
      const midX=(meta.data[i-1].x+meta.data[i].x)/2;
      const topY=Math.min(meta.data[i-1].y,meta.data[i].y)-18;
      ctx.save();
      ctx.font='bold 9px DM Sans,sans-serif';
      ctx.fillStyle=isPos?'#166534':'#991b1b';
      ctx.textAlign='center';
      ctx.fillText((isPos?'▲':'▼')+Math.abs(pct).toFixed(0)+'%',midX,topY);
      ctx.restore();
    }
  }
};
Chart.register(deltaPlugin);

/* ── Bar simples ── */
function mkBar(id,labels,values,col,opts={}){
  dk(id);
  const ctx=document.getElementById(id);if(!ctx)return;
  const isWeekly=opts.weekly||false;
  charts[id]=new Chart(ctx,{type:'bar',
    data:{labels,datasets:[{data:values,backgroundColor:col+'28',borderColor:col,borderWidth:1.5,borderRadius:4}]},
    options:{responsive:true,maintainAspectRatio:false,
      layout:{padding:{top:isWeekly?30:22}},
      plugins:{
        legend:{display:false},
        datalabels:{display:c=>c.dataset.data[c.dataIndex]>0,formatter:v=>fmtN(v),color:col,font:{family:'DM Sans',size:9,weight:'700'},anchor:'end',align:'top',offset:2},
        tooltip:{callbacks:{label:c=>' '+fmtN(c.parsed.y)}},
        delta:{show:isWeekly},
      },
      scales:{
        x:{grid:{display:false},ticks:{font:{size:9},maxTicksLimit:opts.maxTicks||20},border:{color:'transparent'}},
        y:{grid:{color:GC},ticks:{font:{size:9},maxTicksLimit:4},border:{color:'transparent'},beginAtZero:true}
      }}});
}

/* ── Bar + Line misto ── */
function mkBarLine(id,labels,barValues,lineValues,col,opts={}){
  dk(id);
  const ctx=document.getElementById(id); if(!ctx)return;
  const isWeekly=opts.weekly||false;
  const maxLine=Math.max(...lineValues.filter(v=>v>0),1);
  charts[id]=new Chart(ctx,{
    data:{
      labels,
      datasets:[
        {
          type:'bar',
          label:'Vendas',
          data:barValues,
          backgroundColor:col+'28',
          borderColor:col,
          borderWidth:1.5,
          borderRadius:4,
          yAxisID:'yBar',
          datalabels:{
            display:c=>c.dataset.data[c.dataIndex]>0,
            formatter:v=>fmtN(v),
            color:col,
            font:{family:'DM Sans',size:9,weight:'700'},
            anchor:'end',align:'top',offset:2,
          },
        },
        {
          type:'line',
          label:'Receita',
          data:lineValues,
          borderColor:col,
          backgroundColor:'transparent',
          borderWidth:2,
          borderDash:[4,3],
          pointRadius:c=>c.dataset.data[c.dataIndex]>0?3.5:0,
          pointBackgroundColor:col,
          tension:.3,
          yAxisID:'yLine',
          datalabels:{display:false},
        }
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      layout:{padding:{top:26,right:8}},
      plugins:{
        legend:{
          display:true,position:'bottom',
          labels:{font:{size:9},padding:10,boxWidth:9,
            filter:i=>i.text==='Receita'  // mostra só Receita na legenda
          }
        },
        datalabels:{},
        tooltip:{
          mode:'index',intersect:false,
          callbacks:{
            label:c=>{
              if(c.dataset.type==='bar') return ` ${fmtN(c.parsed.y)} vendas`;
              return ` ${brlK(c.parsed.y)}`;
            }
          }
        },
        delta:{show:false}, // sem delta nos ganhos
      },
      scales:{
        x:{grid:{display:false},ticks:{font:{size:9},maxTicksLimit:opts.maxTicks||20},border:{color:'transparent'}},
        yBar:{type:'linear',position:'left',grid:{color:GC},ticks:{font:{size:9},maxTicksLimit:4},border:{color:'transparent'},beginAtZero:true},
        yLine:{type:'linear',position:'right',grid:{display:false},ticks:{font:{size:9},maxTicksLimit:4,callback:v=>brlK(v)},border:{color:'transparent'},beginAtZero:true},
      }
    }
  });
}

/* ── Stacked bar ── */
function mkStackedBar(id,labels,datasets){
  dk(id);
  const ctx=document.getElementById(id);if(!ctx)return;
  const totals=labels.map((_,i)=>datasets.reduce((s,d)=>s+(d.data[i]||0),0));
  charts[id]=new Chart(ctx,{type:'bar',
    data:{labels,datasets},
    options:{responsive:true,maintainAspectRatio:false,
      layout:{padding:{top:22}},
      plugins:{
        legend:{display:true,position:'bottom',labels:{font:{size:9},padding:10,boxWidth:9}},
        datalabels:{
          display:c=>c.datasetIndex===datasets.length-1&&totals[c.dataIndex]>0,
          formatter:(_,c)=>fmtN(totals[c.dataIndex]),
          color:'#1c2b3a',font:{family:'DM Sans',size:9,weight:'700'},anchor:'end',align:'top',offset:2,
        },
        tooltip:{mode:'index',intersect:false},
      },
      scales:{
        x:{stacked:true,grid:{display:false},ticks:{font:{size:9},maxTicksLimit:20},border:{color:'transparent'}},
        y:{stacked:true,grid:{color:GC},ticks:{font:{size:9},maxTicksLimit:4},border:{color:'transparent'},beginAtZero:true}
      }}});
}

/* ── Score line (com banda ICP e tooltip com volume) ── */
function mkScoreLine(id,items,col,snapItems){
  dk(id);
  const ctx=document.getElementById(id);if(!ctx)return;
  const labels=(items||[]).map(x=>x.label);
  const values=(items||[]).map(x=>x.pct||0);
  const volumes=(items||[]).map(x=>x.v||0);

  const bandPlugin={
    id:'scoreBand',
    beforeDraw(chart){
      const{ctx:c,chartArea,scales}=chart;
      if(!chartArea||!scales?.x)return;
      try{
        // ICP = De 6 a 6,9 (idx 4) até De 8 a 8,9 (idx 6)
        const step=scales.x.getPixelForValue(1)-scales.x.getPixelForValue(0);
        const x0=scales.x.getPixelForValue(4)-step/2;
        const x1=scales.x.getPixelForValue(6)+step/2;
        c.save();
        c.fillStyle='rgba(184,135,63,.18)';
        c.fillRect(x0,chartArea.top,x1-x0,chartArea.bottom-chartArea.top);
        // Linha vertical e label ICP
        c.strokeStyle='rgba(184,135,63,.45)';
        c.lineWidth=1;
        c.setLineDash([4,3]);
        c.beginPath();c.moveTo(x0,chartArea.top);c.lineTo(x0,chartArea.bottom);c.stroke();
        c.beginPath();c.moveTo(x1,chartArea.top);c.lineTo(x1,chartArea.bottom);c.stroke();
        c.setLineDash([]);
        c.fillStyle='rgba(184,135,63,.7)';
        c.font='bold 9px DM Sans,sans-serif';
        c.textAlign='center';
        c.fillText('ICP',(x0+x1)/2,chartArea.top+12);
        c.restore();
      }catch(e){}
    }
  };

  charts[id]=new Chart(ctx,{type:'line',
    data:{labels,datasets:[
      ...(snapItems&&snapItems.length?[{
        data:snapItems.map(x=>x.pct||0),
        borderColor:'#bbbbbb',backgroundColor:'transparent',
        borderWidth:1.5,borderDash:[4,3],fill:false,tension:.28,
        pointRadius:2,pointBackgroundColor:'#bbbbbb',
        datalabels:{display:false},
      }]:[]),
      {
        data:values,borderColor:col,backgroundColor:col+'18',
        borderWidth:2,fill:false,tension:.28,
        pointRadius:4,pointHoverRadius:5,pointBackgroundColor:col,
      }
    ]},
    plugins:[bandPlugin],
    options:{responsive:true,maintainAspectRatio:false,
      layout:{padding:{top:24,right:8,left:4}},
      plugins:{
        legend:{display:false},
        datalabels:{
          display:c=>c.dataset.data[c.dataIndex]>0,
          formatter:v=>Number(v).toFixed(v%1?1:0)+'%',
          color:'#1c2b3a',
          backgroundColor:'rgba(255,255,255,.78)',
          borderRadius:3,padding:{top:2,bottom:2,left:4,right:4},
          font:{family:'DM Sans',size:9,weight:'700'},
          anchor:'end',align:'top',offset:3,
        },
        tooltip:{callbacks:{
          label:c=>{
            const pct=Number(c.parsed.y).toFixed(1)+'%';
            const vol=volumes[c.dataIndex]||0;
            return` ${pct} · ${fmtN(vol)} leads`;
          }
        }},
      },
      scales:{
        x:{grid:{display:false},ticks:{font:{size:9}},border:{color:'transparent'}},
        y:{grid:{color:GC},ticks:{font:{size:9},callback:v=>v+'%',maxTicksLimit:5},border:{color:'transparent'},beginAtZero:true,suggestedMax:40}
      }}
  });
}

/* ── Origem temporal ── */
function otHtml(data,col){
  if(!data||!data.length)return'<div style="color:var(--muted);font-size:.78rem">Sem dados.</div>';
  const max=Math.max(...data.map(d=>d.v),1);
  return data.map(d=>`
    <div class="ot-row">
      <div class="ot-label">${esc(d.label)}</div>
      <div class="ot-track"><div class="ot-fill" style="width:${Math.round(d.v/max*100)}%;background:${col}"></div></div>
      <div class="ot-val">${fmtN(d.v)}</div>
      <div class="ot-pct">${d.pct}%</div>
    </div>`).join('');
}

/* ── Sub-tabela de deals (expansível) ── */
function dealsSubTable(deals){
  if(!deals||!deals.length)return'<div style="padding:10px 14px;font-size:.76rem;color:var(--muted)">Nenhuma venda detalhada.</div>';
  return`<table style="width:100%;font-size:.76rem">
    <thead style="background:#2d4459">
      <tr>
        <th style="padding:7px 14px;color:rgba(255,255,255,.7);font-size:.6rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;text-align:left">Campanha</th>
        <th style="padding:7px 14px;color:rgba(255,255,255,.7);font-size:.6rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;text-align:left">Proprietário</th>
        <th style="padding:7px 14px;color:rgba(255,255,255,.7);font-size:.6rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;text-align:left">Produto</th>
        <th style="padding:7px 14px;color:rgba(255,255,255,.7);font-size:.6rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;text-align:right">Data Ganho</th>
        <th style="padding:7px 14px;color:rgba(255,255,255,.7);font-size:.6rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;text-align:right">Valor</th>
      </tr>
    </thead>
    <tbody>
      ${[...deals].sort((a,b)=>b.valor-a.valor).map(d=>`
        <tr style="border-bottom:1px solid var(--border)">
          <td style="padding:7px 14px;font-size:.76rem;color:var(--muted)">${esc((d.campanha||'').length>40?(d.campanha||'').slice(0,38)+'…':d.campanha||'—')}</td>
          <td style="padding:7px 14px;font-size:.76rem;font-weight:500;color:var(--navy)">${esc(d.proprietario||'—')}</td>
          <td style="padding:7px 14px;font-size:.76rem;color:var(--text)">${esc((d.produto||'').length>32?(d.produto||'').slice(0,30)+'…':d.produto||'—')}</td>
          <td style="padding:7px 14px;font-size:.76rem;text-align:right;color:var(--muted)">${d.dataGanho||'—'}</td>
          <td style="padding:7px 14px;font-size:.76rem;font-weight:700;text-align:right;color:var(--navy)">${brl(d.valor||0)}</td>
        </tr>`).join('')}
    </tbody>
  </table>`;
}

/* ── Tabela expansível genérica ── */
function expandTable(rows,prefix){
  if(!rows||!rows.length)return'<div style="padding:10px;font-size:.8rem;color:var(--muted)">Nenhum dado.</div>';
  return`<table>
    <thead><tr><th style="width:24px"></th><th>Origem</th><th>Vendas</th><th>Receita</th><th>Ticket</th></tr></thead>
    <tbody>
      ${rows.map((o,i)=>`
        <tr class="ori-row" onclick="toggleDeals('${prefix}-${i}')" style="cursor:pointer">
          <td style="text-align:center;color:var(--muted);font-size:.8rem" id="${prefix}-arr-${i}">▶</td>
          <td class="td-name">${esc(o.nome)}</td>
          <td>${fmtN(o.t)}</td>
          <td>${brl(o.rev||0)}</td>
          <td>${o.ticket>0?brl(o.ticket):'—'}</td>
        </tr>
        <tr id="${prefix}-${i}" style="display:none">
          <td colspan="5" style="padding:0;background:var(--bg)">${dealsSubTable(o.deals)}</td>
        </tr>`).join('')}
    </tbody>
  </table>`;
}

/* ── Tabela campanha (deals direto, expansível como item único) ── */
function campTable(deals,prefix){
  if(!deals||!deals.length)return'<div style="padding:10px;font-size:.8rem;color:var(--muted)">Nenhuma venda da campanha no período.</div>';
  const total=deals.reduce((s,d)=>s+(d.valor||0),0);
  return`<table>
    <thead><tr><th style="width:24px"></th><th>Campanha</th><th>Receita</th></tr></thead>
    <tbody>
      <tr class="ori-row" onclick="toggleDeals('${prefix}-0')" style="cursor:pointer">
        <td style="text-align:center;color:var(--muted);font-size:.8rem" id="${prefix}-arr-0">▶</td>
        <td class="td-name">Vendas da campanha</td>
        <td>${brl(total)}</td>
      </tr>
      <tr id="${prefix}-0" style="display:none">
        <td colspan="3" style="padding:0;background:var(--bg)">${dealsSubTable(deals)}</td>
      </tr>
    </tbody>
    <tfoot><tr><td></td><td>Total · ${fmtN(deals.length)} vendas</td><td>${brl(total)}</td></tr></tfoot>
  </table>`;
}

/* ── Render ── */
function render(){
  if(!DATA)return;
  const d=DATA[PROD];
  const col=color(PROD),col2=color2(PROD);
  const lbl=PROD==='lean'?'Lean Governance':'CES';
  const mes=fmtM(DATA.mes);
  const ts=new Date(DATA.updatedAt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

  /* ── Tabela produtos criados ── */
  const tblProd=criados.produtosVendidos?.length?`
    <div class="sec-lbl2">Produtos vendidos · leads criados este mês<span></span></div>

      ${expandTable(criados.produtosVendidos,'pv')}
    </div>`:'' ;

  document.getElementById('content').innerHTML=`

    <div class="ph-row">
      <div>
        <div class="ph-badge ${badgeClass}">${lbl}</div>
        <div class="ph-ttl">${lbl} · ${mes}</div>
        <div class="ph-sub">Leads e perdas por campanha · Ganhos por produto e campanha de origem</div>
      </div>
    </div>

    <!-- ══ LEADS CRIADOS ═══════════════════════════ -->
    <div class="sec-block">
      <div class="sec-eyebrow">Eixo temporal · Data de Criação</div>
      <div class="sec-title">Leads Criados <span class="sec-date-tag tag-criado">Mês atual · ${mes}</span></div>
      <div class="sec-divider ${divClass}"></div>
    </div>

    <div class="charts-2">
      <div class="ccard">
        <div class="ccard-ttl">Volume dia a dia · por status</div>
        <div class="cwrap md"><canvas id="ch-cri-dia"></canvas></div>
      </div>
      <div class="ccard">
        <div class="ccard-ttl">Volume por semana · últimas 8 semanas completas (Qui→Qua)</div>
        <div class="cwrap md"><canvas id="ch-cri-sem"></canvas></div>
      </div>
    </div>

    <div class="charts-1">
      <div class="ccard">
        <div class="ccard-ttl">% por faixa de score · criados no mês · zona dourada = ICP</div>

      <div class="kpi"><div class="kpi-accent" style="background:${col}"></div>

        ${SNAP&&SNAP.data?deltaHtml(criados.total,SNAP.data[PROD]?.criados?.total):''}</div>
      <div class="kpi"><div class="kpi-accent" style="background:var(--navy)"></div>
        <div class="lbl">Em Aberto</div><div class="val" style="color:var(--navy)">${fmtN(criados.status.a)}</div><div class="sub">${criados.total>0?((criados.status.a/criados.total)*100).toFixed(0):'0'}% do total</div></div>

        <div class="lbl">Ganhos dos criados</div><div class="val" style="color:var(--sage)">${fmtN(criados.status.g)}</div><div class="sub">leads criados este mês</div></div>

      <div class="kpi"><div class="kpi-accent" style="background:${col2}"></div>
        <div class="lbl">Taxa de Conversão</div><div class="val" style="color:${col}">${criados.taxaConv}%</div><div class="sub">ganhos ÷ criados</div></div>
    </div>
    ${tblProd}

    <!-- ══ NEGÓCIOS GANHOS ════════════════════════ -->
    <div class="sec-block">
      <div class="sec-eyebrow">Eixo temporal · Data de Ganho</div>
      <div class="sec-title">Negócios Ganhos <span class="sec-date-tag tag-ganho">Data de Ganho · ${mes}</span></div>
      <div class="sec-divider div-ganho"></div>
    </div>

    <div class="gtog-row">
      <button class="gtog active" id="gtog-prod" onclick="switchGanhos('prod')">Por Produto vendido</button>

    <div id="view-prod">

/* Consolida funis < 10 em Outros expansível */
function buildFunisRows(funis, prefix, scoreFaixas){
  const MIN = 10;
  const grandes = funis.filter(f=>f.t >= MIN);
  const pequenos = funis.filter(f=>f.t < MIN);
  let rows = grandes.map(f=>`
    <tr>
      <td class="td-name">${esc(f.nome)}</td>
      <td>${fmtN(f.t)}</td>
      <td>${f.pct}%</td>
      ${(f.scoreFaixas||[]).map(s=>`<td style="font-size:.75rem;text-align:right">${s.v>0?fmtN(s.v):''}</td>`).join('')}
    </tr>`).join('');

  if(pequenos.length){
    const totPeq = pequenos.reduce((s,f)=>s+f.t,0);
    const totGeral = funis.reduce((s,f)=>s+f.t,0);
    const pctPeq = totGeral>0?Math.round(totPeq/totGeral*100):0;
    // Agrega scoreFaixas dos pequenos
    const aggScore = scoreFaixas ? scoreFaixas.map((_,i)=>({v:pequenos.reduce((s,f)=>s+(f.scoreFaixas?.[i]?.v||0),0)})) : [];
    const detalhes = pequenos.map(f=>`
      <tr style="background:var(--bg)">
        <td style="padding-left:28px;font-size:.76rem;color:var(--muted)">${esc(f.nome)}</td>
        <td style="font-size:.76rem">${fmtN(f.t)}</td>
        <td style="font-size:.76rem">${f.pct}%</td>
        ${(f.scoreFaixas||[]).map(s=>`<td style="font-size:.72rem;text-align:right">${s.v>0?fmtN(s.v):''}</td>`).join('')}
      </tr>`).join('');

    rows += `
    <tr class="ori-row" onclick="toggleDeals('${prefix}-outros')" style="cursor:pointer">
      <td class="td-name"><span id="${prefix}-outros-arr">▶</span> Outros (${pequenos.length} funis)</td>
      <td>${fmtN(totPeq)}</td>
      <td>${pctPeq}%</td>
      ${aggScore.map(s=>`<td style="font-size:.75rem;text-align:right">${s.v>0?fmtN(s.v):''}</td>`).join('')}
    </tr>
    <tr id="${prefix}-outros" class="outros-hidden">
      <td colspan="${3+(scoreFaixas?.length||0)}" style="padding:0">${detalhes}</td>
    </tr>`;
  }
  return rows;
}

function buildEtapasTable(funis, etapas, prefix){
  const MIN = 10;
  const grandes = funis.filter(f=>f.t >= MIN);
  const pequenos = funis.filter(f=>f.t < MIN);

  // Coleta todas as etapas únicas em ordem
  const etapasSet = new Map();
  grandes.forEach(f=>{
    (etapas[f.nome]||[]).forEach(e=>{
      if(!etapasSet.has(e.nome)) etapasSet.set(e.nome,{order:etapasSet.size});
    });
  });
  const etapasCols = [...etapasSet.keys()];

  if(!etapasCols.length) return '<div style="color:var(--muted);font-size:.8rem;padding:14px">Sem leads abertos no período.</div>';

  let rows = grandes.map(f=>{
    const etapasFunil = Object.fromEntries((etapas[f.nome]||[]).map(e=>[e.nome,e.t]));
    const totalAberto = Object.values(etapasFunil).reduce((s,v)=>s+v,0);
    return `<tr>
      <td class="td-name">${esc(f.nome)}</td>
      <td>${fmtN(totalAberto)}</td>
      ${etapasCols.map(e=>`<td style="font-size:.75rem;text-align:right">${etapasFunil[e]>0?fmtN(etapasFunil[e]):''}</td>`).join('')}
    </tr>`;
  }).join('');

  // Outros (pequenos)
  if(pequenos.length){
    const aggEtapas = {};
    pequenos.forEach(f=>(etapas[f.nome]||[]).forEach(e=>{aggEtapas[e.nome]=(aggEtapas[e.nome]||0)+e.t;}));
    const totPeq = Object.values(aggEtapas).reduce((s,v)=>s+v,0);
    const detalheRows = pequenos.map(f=>{
      const ef = Object.fromEntries((etapas[f.nome]||[]).map(e=>[e.nome,e.t]));
      const tot = Object.values(ef).reduce((s,v)=>s+v,0);
      return `<tr style="background:var(--bg)">
        <td style="padding-left:28px;font-size:.76rem;color:var(--muted)">${esc(f.nome)}</td>
        <td style="font-size:.76rem">${fmtN(tot)}</td>
        ${etapasCols.map(e=>`<td style="font-size:.72rem;text-align:right">${ef[e]>0?fmtN(ef[e]):''}</td>`).join('')}
      </tr>`;
    }).join('');
    rows += `
    <tr class="ori-row" onclick="toggleDeals('${prefix}-et-outros')" style="cursor:pointer">
      <td class="td-name"><span id="${prefix}-et-outros-arr">▶</span> Outros (${pequenos.length} funis)</td>
      <td>${fmtN(totPeq)}</td>
      ${etapasCols.map(e=>`<td style="font-size:.75rem;text-align:right">${aggEtapas[e]>0?fmtN(aggEtapas[e]):''}</td>`).join('')}
    </tr>
    <tr id="${prefix}-et-outros" class="outros-hidden">
      <td colspan="${2+etapasCols.length}" style="padding:0">${detalheRows}</td>
    </tr>`;
  }

  return `<table>
    <thead><tr>
      <th>Funil</th><th>Abertos</th>
      ${etapasCols.map(e=>`<th style="font-size:.55rem;padding:7px 5px">${esc(e)}</th>`).join('')}
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function toggleDeals(id){
  const row=document.getElementById(id);if(!row)return;
  // Arrow: busca span com id = id+'-arr' (padrão novo)
  // ou prefixo-arr-sufixo (padrão antigo das tabelas de campanha)
  let arrow=document.getElementById(id+'-arr');
  if(!arrow){
    const parts=id.split('-');
    const idx=parts[parts.length-1];
    const prefix=parts.slice(0,-1).join('-');
    arrow=document.getElementById(prefix+'-arr-'+idx);
  }
  const isHidden=row.classList.contains('outros-hidden')||row.style.display==='none'||row.style.display==='';
  if(isHidden){row.classList.remove('outros-hidden');row.style.display='table-row';}
  else{row.style.display='none';row.classList.add('outros-hidden');}
  if(arrow)arrow.textContent=isHidden?'▼':'▶';
}


/* ════════════════════════════════════════════════════════════
   SNAPSHOT · COMPARAÇÃO · HISTÓRICO
   ════════════════════════════════════════════════════════════ */
let SNAP = null; // snapshot carregado para comparação

/* ── Snapshot: baixa JSON ── */
function doSnapshot(){
  if(!DATA){alert('Carregue os dados primeiro.');return;}
  const now = new Date();
  const dias = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
  const nome = `${dias[now.getDay()]}, ${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const payload = { nome, criadoEm: now.toISOString(), produto: PROD, data: DATA };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `snapshot-${PROD}-${now.toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

/* ── Modal comparar ── */
function openComparar(){ document.getElementById('cmpOverlay').classList.add('open'); }
function closeCmpModal(){ document.getElementById('cmpOverlay').classList.remove('open'); }

function onCmpFile(e){
  const file = e.target.files[0]; if(!file)return;
  const reader = new FileReader();
  reader.onload = ev => {
    try{
      const json = JSON.parse(ev.target.result);
      if(!json.data){ alert('Arquivo inválido.'); return; }
      SNAP = json;
      closeCmpModal();
      aplicarComparacao();
    }catch(err){ alert('Erro ao ler arquivo: '+err.message); }
  };
  reader.readAsText(file);
  e.target.value=''; // reset input
}

function aplicarComparacao(){
  if(!SNAP)return;
  document.getElementById('cmpBanner').classList.add('on');
  document.getElementById('cmpBannerTxt').textContent = `Comparando com: ${SNAP.nome}`;
  document.getElementById('btnLimparCmp').style.display='inline-block';
  render(); // re-render com SNAP disponível
}

function limparComparacao(){
  SNAP=null;
  document.getElementById('cmpBanner').classList.remove('on');
  document.getElementById('btnLimparCmp').style.display='none';
  render();
}

/* ── Helpers de delta ── */
function deltaHtml(atual, anterior){
  if(!anterior||anterior===0) return '';
  const pct = ((atual-anterior)/anterior*100);
  const abs  = Math.abs(pct).toFixed(0)+'%';
  if(Math.abs(pct)<0.5) return `<span class="kpi-delta delta-eq">= mesmo</span>`;
  const up = pct>0;
  return `<span class="kpi-delta ${up?'delta-up':'delta-dn'}">${up?'▲':'▼'} ${abs} vs snap</span>`;
}

function ppDelta(atualPct, anteriorPct){
  if(anteriorPct===undefined||anteriorPct===null) return '';
  const diff = atualPct - anteriorPct;
  if(Math.abs(diff)<0.5) return `<span class="motivo-delta delta-eq">=</span>`;
  const up = diff>0;
  return `<span class="motivo-delta ${up?'delta-up':'delta-dn'}">${up?'+':''}${diff.toFixed(0)}pp</span>`;
}

/* ── Histórico ── */
function openHistorico(){
  renderHistorico();
  document.getElementById('histOverlay').classList.add('open');
}
function closeHistorico(){ document.getElementById('histOverlay').classList.remove('open'); }

function getSnaps(){
  try{ return JSON.parse(localStorage.getItem('ba_snaps')||'[]'); }catch{ return []; }
}
function saveSnaps(arr){ localStorage.setItem('ba_snaps',JSON.stringify(arr)); }

function renderHistorico(){
  const snaps = getSnaps();
  const el = document.getElementById('histList');
  if(!snaps.length){
    el.innerHTML='<div class="hist-empty">Nenhum snapshot salvo.<br><small>Use o botão 📸 Snapshot para gravar.</small></div>';
    return;
  }
  el.innerHTML = snaps.slice().reverse().map((s,ri)=>{
    const i = snaps.length-1-ri;
    return `<div class="hist-item">
      <div class="hist-item-left">
        <h4>${esc(s.nome)}</h4>
        <p>Produto: ${(s.produto||'—').toUpperCase()} · ${new Date(s.criadoEm).toLocaleString('pt-BR')}</p>
      </div>
      <div class="hist-item-btns">
        <button class="hist-btn hist-btn-pdf" onclick="printSnapshot(${i})">🖨 PDF</button>
        <button class="hist-btn" onclick="downloadSnap(${i})">⬇ JSON</button>
        <button class="hist-btn hist-btn-del" onclick="deleteSnap(${i})">🗑</button>
      </div>
    </div>`;
  }).join('');
}

function deleteSnap(i){
  if(!confirm('Deletar este snapshot?'))return;
  const arr=getSnaps(); arr.splice(i,1); saveSnaps(arr); renderHistorico();
}

function downloadSnap(i){
  const s=getSnaps()[i]; if(!s)return;
  const blob=new Blob([JSON.stringify(s,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;
  a.download=`snapshot-${(s.produto||'snap')}-${s.criadoEm.slice(0,10)}.json`;
  a.click();URL.revokeObjectURL(url);
}

function printSnapshot(i){
  const s=getSnaps()[i]; if(!s)return;
  const win=window.open('','_blank','width=900,height=700');
  win.document.write(buildPrintHtml(s));
  win.document.close();
  win.onload=()=>{win.print();};
}

function buildPrintHtml(snap){
  const d    = snap.data;

    if(!ym) return '—';

  };
  const brl2  = n => n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});

  function produtoPages(prod){

    const{criados,ganhos,perdidos} = pd;
    const mes = fmtM2(d.mes);

    // ── helpers de bloco ──────────────────────────────────────
    const kpi = (l,v,s) => `
      <div class="kbox">
        <div class="klbl">${l}</div>
        <div class="kval">${v}</div>
        <div class="ksub">${s}</div>

    const tbl = (headers, rows, footer) => `
      <table>
        <thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
        <tbody>${rows}</tbody>
        ${footer?`<tfoot><tr>${footer}</tr></tfoot>`:''}

    const bar = (label,v,total,col2) => {
      const pct = total>0?Math.round(v/total*100):0;
      return `<div class="bar-row">
        <div class="bar-lbl">${label}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${col2}"></div></div>
        <div class="bar-val">${fmtN2(v)}</div>
        <div class="bar-pct">${pct}%</div>
      </div>`;
    };

    // ── Criados por dia (top 10 por volume) ──────────────────
    const diasComDados = criados.porDia.filter(x=>x.v>0);

            origensRows?`<td>Total</td><td>${fmtN2(ganhos.porProduto.total)}</td><td>${brl2(ganhos.porProduto.receita)}</td><td>${brl2(ganhos.porProduto.ticket)}</td>`:null)}

          <div class="blk-title">Perdidos por dia</div>

        </div>

          <div class="blk-title">Top motivos de perda</div>
          ${tbl(['Motivo','Qtd','%'], motivosRows||'<tr><td colspan="3" class="empty">Sem dados</td></tr>', null)}

.cover-title{font-family:'Fraunces',serif;font-size:2.6rem;font-weight:700;color:#1c2b3a;line-height:1.1;margin-bottom:12px}
.cover-date{font-size:1rem;color:#8a8277;margin-bottom:4px}
.cover-snap{font-size:.78rem;color:#aaa;margin-top:32px;padding-top:16px;border-top:1px solid #e0d9d0}
.cover-line{width:60px;height:4px;border-radius:2px;background:linear-gradient(90deg,#4a6fa5,#0e7490);margin:20px 0}

/* Produto capa */
.prod-eyebrow{font-size:.6rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8a8277;margin-bottom:6px}
.prod-title{font-family:'Fraunces',serif;font-size:2rem;font-weight:700;line-height:1.1;margin-bottom:8px}
.prod-sub{font-size:.85rem;color:#8a8277;margin-bottom:4px}
.prod-meta{font-size:.72rem;color:#aaa;margin-top:24px;padding-top:12px;border-top:1px solid #e0d9d0}

/* Seção */
.sec-head{border-left:4px solid;padding-left:12px;margin-bottom:16px}
.sec-eyebrow{font-size:.58rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8a8277;margin-bottom:3px}
.sec-title{font-family:'Fraunces',serif;font-size:1.2rem;font-weight:700;color:#1c2b3a}

/* KPIs */
.krow{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.kbox{background:#fff;border:1px solid #e0d9d0;border-radius:7px;padding:12px 10px;flex:1;min-width:100px}
.klbl{font-size:.58rem;text-transform:uppercase;letter-spacing:.1em;color:#8a8277;margin-bottom:5px}
.kval{font-family:'Fraunces',serif;font-size:1.3rem;font-weight:700;color:#1c2b3a;line-height:1}
.ksub{font-size:.62rem;color:#8a8277;margin-top:3px}

/* Dois blocos lado a lado */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* Tabelas */
.blk-title{font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8a8277;margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:.75rem;background:#fff;border-radius:6px;overflow:hidden}
thead tr{background:#1c2b3a}
thead th{color:rgba(255,255,255,.75);font-size:.6rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:7px 9px;text-align:left}
thead th:not(:first-child){text-align:right}
tbody tr{border-bottom:1px solid #e0d9d0}
tbody tr:last-child{border-bottom:none}
tbody td{padding:6px 9px;color:#1c2020}
tbody td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
tfoot tr{background:#f5e9d6}
tfoot td{padding:6px 9px;font-weight:700;color:#1c2b3a;border-top:1.5px solid #e0d9d0}
tfoot td:not(:first-child){text-align:right}
.empty{color:#8a8277;font-size:.72rem;padding:8px}

/* Barras */
.bars{display:flex;flex-direction:column;gap:7px}
.bar-row{display:flex;align-items:center;gap:8px}
.bar-lbl{width:100px;flex-shrink:0;font-size:.72rem;color:#1c2020}
.bar-track{flex:1;background:#e0d9d0;border-radius:3px;height:6px}
.bar-fill{height:6px;border-radius:3px}
.bar-val{width:34px;text-align:right;font-size:.72rem;font-weight:700;color:#1c2b3a}
.bar-pct{width:32px;text-align:right;font-size:.68rem;color:#8a8277}
</style>
</head>
<body>

<div class="pg">
  <div class="cover">
    <div class="cover-logo">Board Academy · Inteligência Comercial</div>
    <div class="cover-title">Relatório<br>Gerencial</div>
    <div class="cover-line"></div>
    <div class="cover-date">${hoje}</div>
    <div class="cover-snap">Gerado de: ${nome}</div>
  </div>
</div>

${produtoPages('lean')}
${produtoPages('ces')}

</body></html>`;
}


/* ── PDF ── */
function gerarPDF(){
  // Usa snapshot carregado se houver, senão usa dados ao vivo
  const snapData = SNAP || {
    nome: new Date().toLocaleString('pt-BR'),
    criadoEm: new Date().toISOString(),
    data: DATA,
  };
  const html = buildPrintHtml(snapData);
  const win  = window.open('','_blank','width=960,height=720');
  win.document.write(html);
  win.document.close();
  win.onload = () => { setTimeout(() => win.print(), 800); };
}

/* ── Atualizar botões ── */
function updateCmpBtn(){
  const btn=document.getElementById('btnComparar');
  if(btn) btn.disabled=false;
  const pdf=document.getElementById('btnPdf');
  if(pdf) pdf.disabled=false;
}

async function loadData(){
  const err=document.getElementById('errBanner');
  err.style.display='none';
  try{
    const r=await fetch(`/api/report?mes=${MES_FILTRO||''}`);
    const j=await r.json();
    if(!j.ok)throw new Error(j.error);
    DATA=j;render();renderAnalitica();updateCmpBtn();
  }catch(e){
    err.textContent=`Erro ao carregar: ${e.message}`;
    err.style.display='block';
    document.getElementById('content').innerHTML='<div class="state-wrap"><span>Não foi possível carregar os dados.</span></div>';
  }
}

async function doRefresh(){
  const btn=document.getElementById('btnRefresh');
  btn.disabled=true;btn.textContent='↺ Atualizando…';
  document.getElementById('content').innerHTML='<div class="state-wrap"><div class="spinner"></div><span>Atualizando…</span></div>';
  await loadData();
  btn.disabled=false;btn.textContent='↺ Atualizar';
}

buildMesSelector();
loadData();
</script>

<!-- ════ FERRAMENTAS DE APRESENTAÇÃO ════
     L=Laser  A=Seta  C=Caneta  S=Spotlight  Z=Zoom ════ -->
<canvas id="pCanvas" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:8000;pointer-events:none;"></canvas>
<svg id="pSvg" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:8001;pointer-events:none;overflow:visible;"></svg>
<div id="pSpot" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:7999;pointer-events:none;display:none;"></div>
<div id="pZoomBox" style="position:fixed;border:2px dashed #f5c518;background:rgba(245,197,24,.08);z-index:8010;pointer-events:none;display:none;"></div>
<div id="pZoomView" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:9000;background:#f2ede6;display:none;overflow:hidden;">
  <div id="pZoomContent" style="position:absolute;transform-origin:top left;"></div>
  <button onclick="exitZoom()" style="position:fixed;top:18px;right:24px;background:#1c2b3a;color:#fff;border:none;border-radius:8px;padding:8px 18px;font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:600;cursor:pointer;z-index:9999;">✕ Sair do Zoom (Esc)</button>
</div>
<div id="pToolbar" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(28,43,58,.95);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);border-radius:40px;display:flex;align-items:center;gap:4px;padding:6px 10px;z-index:9500;box-shadow:0 8px 32px rgba(0,0,0,.4);font-family:'DM Sans',sans-serif;">
  <div style="font-size:.58rem;color:rgba(255,255,255,.3);letter-spacing:.08em;text-transform:uppercase;padding:0 8px 0 4px;border-right:1px solid rgba(255,255,255,.1);margin-right:4px;">Apresentação</div>
  <button class="ptool" id="pt-laser" onclick="setTool('laser')" title="Laser (L)">🔴 Laser</button>
  <button class="ptool" id="pt-arrow" onclick="setTool('arrow')" title="Seta (A)">↗ Seta</button>
  <button class="ptool" id="pt-pen"   onclick="setTool('pen')"   title="Caneta (C)">✏️ Caneta</button>
  <button class="ptool" id="pt-spot"  onclick="setTool('spot')"  title="Spotlight (S)">🔦 Foco</button>
  <button class="ptool" id="pt-zoom"  onclick="setTool('zoom')"  title="Zoom (Z)">🔍 Zoom</button>
  <div style="width:1px;height:20px;background:rgba(255,255,255,.1);margin:0 4px;"></div>
  <button class="ptool" onclick="clearCanvas()" title="Limpar (Del)" style="color:rgba(255,100,100,.8)">✕ Limpar</button>
</div>
<style>
.ptool{background:none;border:none;color:rgba(255,255,255,.65);font-family:'DM Sans',sans-serif;font-size:.72rem;font-weight:500;padding:6px 13px;border-radius:24px;cursor:pointer;transition:all .15s;white-space:nowrap;}
.ptool:hover{background:rgba(255,255,255,.1);color:#fff}
.ptool.on{background:rgba(245,197,24,.25);color:#f5c518;border:1px solid rgba(245,197,24,.4)}
</style>
<script>
let pTool=null,pDraw=false,pPoints=[],pArrow=null;
const pCvs=document.getElementById('pCanvas');
const pCtx=pCvs.getContext('2d');
const pSvg=document.getElementById('pSvg');
const pSpot=document.getElementById('pSpot');
let laserTrail=[],laserEl=null,laserTrailEls=[];

function resizeCvs(){pCvs.width=window.innerWidth;pCvs.height=window.innerHeight;}
resizeCvs();window.addEventListener('resize',resizeCvs);

function setTool(t){
  pTool=pTool===t?null:t;
  ['laser','arrow','pen','spot','zoom'].forEach(id=>{const b=document.getElementById('pt-'+id);if(b)b.classList.toggle('on',pTool===id);});
  pCvs.style.pointerEvents=['arrow','pen','zoom'].includes(pTool)?'auto':'none';
  document.body.style.cursor=pTool?'crosshair':'';
  if(pTool!=='spot')pSpot.style.display='none';
  if(pTool!=='laser')clearLaser();
  if(pTool!=='zoom')document.getElementById('pZoomBox').style.display='none';
  if(pTool==='spot')pSpot.style.display='block';
}

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.key==='l'||e.key==='L')setTool('laser');
  if(e.key==='a'||e.key==='A')setTool('arrow');
  if(e.key==='c'||e.key==='C')setTool('pen');
  if(e.key==='s'||e.key==='S')setTool('spot');
  if(e.key==='z'||e.key==='Z')setTool('zoom');
  if(e.key==='Delete'||e.key==='Backspace')clearCanvas();
  if(e.key==='Escape'){exitZoom();setTool(null);}
});

function clearLaser(){
  if(laserEl){laserEl.remove();laserEl=null;}
  laserTrailEls.forEach(e=>e.remove());
  laserTrailEls=[];laserTrail=[];
}

document.addEventListener('mousemove',e=>{
  if(pTool==='laser'){
    laserTrail.push({x:e.clientX,y:e.clientY,t:Date.now()});
    if(laserTrail.length>20)laserTrail.shift();
    laserTrailEls.forEach(el=>el.remove());laserTrailEls=[];
    const now=Date.now();
    laserTrail.forEach(pt=>{
      const age=(now-pt.t)/400;if(age>1)return;
      const r=Math.max(1,4*(1-age)),op=Math.max(0,0.5*(1-age));
      const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
      c.setAttribute('cx',pt.x);c.setAttribute('cy',pt.y);c.setAttribute('r',r);c.setAttribute('fill',`rgba(255,30,30,${op})`);
      pSvg.appendChild(c);laserTrailEls.push(c);
    });
    if(!laserEl){
      laserEl=document.createElementNS('http://www.w3.org/2000/svg','circle');
      laserEl.setAttribute('r','5');laserEl.setAttribute('fill','rgba(255,30,30,.95)');
      if(!document.getElementById('laserDefs')){
        const defs=document.createElementNS('http://www.w3.org/2000/svg','defs');defs.id='laserDefs';
        defs.innerHTML=`<filter id="laserBlur" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="2.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
        pSvg.prepend(defs);
      }
      laserEl.setAttribute('filter','url(#laserBlur)');pSvg.appendChild(laserEl);
    }
    laserEl.setAttribute('cx',e.clientX);laserEl.setAttribute('cy',e.clientY);
  }
  if(pTool==='spot')pSpot.style.background=`radial-gradient(circle 200px at ${e.clientX}px ${e.clientY}px,transparent 0%,rgba(0,0,0,.75) 100%)`;
});

pCvs.addEventListener('mousedown',e=>{if(!pTool)return;pDraw=true;if(pTool==='arrow')pArrow={x1:e.clientX,y1:e.clientY};if(pTool==='pen')pPoints=[{x:e.clientX,y:e.clientY}];if(pTool==='zoom')zoomStart(e);});
pCvs.addEventListener('mousemove',e=>{if(!pDraw)return;if(pTool==='pen'){pPoints.push({x:e.clientX,y:e.clientY});drawStroke(pPoints);}if(pTool==='zoom')zoomDrag(e);});
pCvs.addEventListener('mouseup',e=>{if(!pDraw)return;pDraw=false;if(pTool==='arrow'&&pArrow){drawArrow(pArrow.x1,pArrow.y1,e.clientX,e.clientY);pArrow=null;}if(pTool==='pen')pPoints=[];if(pTool==='zoom')zoomEnd(e);});

function drawStroke(pts){if(pts.length<2)return;pCtx.strokeStyle='#e03030';pCtx.lineWidth=2.5;pCtx.lineCap='round';pCtx.lineJoin='round';pCtx.beginPath();pCtx.moveTo(pts[pts.length-2].x,pts[pts.length-2].y);pCtx.lineTo(pts[pts.length-1].x,pts[pts.length-1].y);pCtx.stroke();}

function drawArrow(x1,y1,x2,y2){
  const id=`arr${Date.now()}`;const g=document.createElementNS('http://www.w3.org/2000/svg','g');
  g.innerHTML=`<defs><marker id="${id}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#f5c518"/></marker></defs><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#f5c518" stroke-width="3" stroke-linecap="round" marker-end="url(#${id})" opacity="1" style="transition:opacity 1s ease"/>`;
  pSvg.appendChild(g);
  setTimeout(()=>{const l=g.querySelector('line');if(l)l.style.opacity='0';},2000);
  setTimeout(()=>g.remove(),3100);
}

function clearCanvas(){pCtx.clearRect(0,0,pCvs.width,pCvs.height);[...pSvg.querySelectorAll('g')].forEach(g=>g.remove());}

let zRect={x:0,y:0,w:0,h:0};
const zBox=document.getElementById('pZoomBox');
function zoomStart(e){zRect={x:e.clientX,y:e.clientY,w:0,h:0};zBox.style.cssText+=`;left:${e.clientX}px;top:${e.clientY}px;width:0;height:0;display:block;`;}
function zoomDrag(e){const w=e.clientX-zRect.x,h=e.clientY-zRect.y;zRect.w=w;zRect.h=h;zBox.style.left=(w<0?e.clientX:zRect.x)+'px';zBox.style.top=(h<0?e.clientY:zRect.y)+'px';zBox.style.width=Math.abs(w)+'px';zBox.style.height=Math.abs(h)+'px';}
function zoomEnd(e){
  zBox.style.display='none';
  const rx=Math.min(zRect.x,e.clientX),ry=Math.min(zRect.y,e.clientY);
  const rw=Math.abs(zRect.w),rh=Math.abs(zRect.h);
  if(rw<30||rh<30)return;
  const scale=Math.min(window.innerWidth/rw,window.innerHeight/rh);
  const zv=document.getElementById('pZoomView'),zc=document.getElementById('pZoomContent');
  const clone=document.body.cloneNode(true);
  ['pToolbar','pCanvas','pSvg','pSpot','pZoomBox','pZoomView'].forEach(id=>{const el=clone.querySelector('#'+id);if(el)el.remove();});
  zc.innerHTML='';zc.appendChild(clone);
  zc.style.width=window.innerWidth+'px';zc.style.height=window.innerHeight+'px';
  zc.style.transform=`scale(${scale}) translate(${-rx}px,${-ry}px)`;
  zv.style.display='block';setTool(null);
}
function exitZoom(){document.getElementById('pZoomView').style.display='none';}
</script>
</body>
</html>
